name: tuff_project
description: "A new Flutter project following Clean Architecture with GetX and Hive."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  google_fonts: ^6.3.2
  flutter_screenutil: ^5.9.3
  flutter_inset_shadow: ^2.0.3
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/Logo-1.png
